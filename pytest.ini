[pytest]
# Resolve `import s3e` against this checkout, not any installed copy — bare
# pytest in a git worktree would otherwise silently test the wrong source.
pythonpath = .
# Docstring examples run with the tests. Backend modules are not collected:
# they import torch/vLLM at import time and their docstrings hold no examples.
# (--ignore-glob is relative to the working directory; when pytest runs from
# elsewhere, --doctest-ignore-import-errors skips backends whose extra is
# missing instead of failing collection.)
testpaths = tests s3e
addopts = --doctest-modules --ignore-glob=s3e/backends/* --doctest-ignore-import-errors
doctest_optionflags = NORMALIZE_WHITESPACE NUMBER
markers =
    slow: marks tests that download and run real HuggingFace models (deselect with '-m "not slow"')
