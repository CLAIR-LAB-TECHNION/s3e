[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s3e"
version = "0.4.0"
authors = [
    { name = "Guy Azran", email = "guy.azran@campus.technion.ac.il" },
]
description = "Vision-language models as state estimators for PDDL-based planning"
keywords = ["Foundation Models", "Artificial Intelligence", "Task and Motion Planning", "PDDL", "State Estimation"]
readme = "README.md"
requires-python = ">= 3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "tqdm",
    "Pillow",
]

[project.optional-dependencies]
hf = ["torch", "torchvision", "transformers", "accelerate"]
openai = ["openai"]
# VLLMBackend relies on SamplingParams(logprobs=-1) / LLM(max_logprobs=-1)
# for full-vocab logprobs, added in vLLM 0.11.0 (vllm-project/vllm#25031).
vllm = ["vllm>=0.11.0"]
pddl = ["unified-planning>=1.3.0"]
calibration = ["scikit-learn"]
# Everything except vllm, which has hard platform constraints.
all = ["s3e[hf,openai,pddl,calibration]"]
dev = ["pytest", "s3e[all]"]
# dev plus vllm: needed for the vLLM test coverage; requires a CUDA host.
dev-gpu = ["s3e[dev,vllm]"]

[project.urls]
Repository = "https://github.com/CLAIR-LAB-TECHNION/s3e"

[tool.setuptools.packages.find]
include = ["s3e*"]
