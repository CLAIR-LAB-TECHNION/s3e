[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s3e"
version = "0.5.0"
authors = [
    { name = "Guy Azran", email = "guy.azran@campus.technion.ac.il" },
]
description = "Vision-language models as state estimators for PDDL-based planning"
keywords = ["Foundation Models", "Artificial Intelligence", "Task and Motion Planning", "PDDL", "State Estimation"]
readme = "README.md"
requires-python = ">= 3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
license = "MIT"
license-files = ["LICENSE"]
# Floors are the lowest versions CI tests (the "lowest dependencies" job).
dependencies = [
    "numpy>=1.21.2",
    "tqdm>=4.42.1",
    "Pillow>=8.4",
]

[project.optional-dependencies]
# transformers 4.56 added from_pretrained(dtype=...), which HuggingFaceVLM uses.
hf = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.56", "accelerate>=0.26"]
# LLMTranslator uses the Responses API (client.responses), added in openai 1.66.
openai = ["openai>=1.66"]
# VLLMBackend relies on SamplingParams(logprobs=-1) / LLM(max_logprobs=-1)
# for full-vocab logprobs, added in vLLM 0.11.0 (vllm-project/vllm#25031).
vllm = ["vllm>=0.11.0"]
pddl = ["unified-planning>=1.3.0"]
calibration = ["scikit-learn>=1.0.2"]
# Everything except vllm, which has hard platform constraints.
all = ["s3e[hf,openai,pddl,calibration]"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.2", "s3e[all]"]
# dev plus vllm: needed for the vLLM test coverage; requires a CUDA host.
dev-gpu = ["s3e[dev,vllm]"]
# Sphinx API reference; heavy backends (torch, transformers, vllm) are mocked.
docs = ["sphinx>=7", "myst-parser>=2", "furo", "s3e[openai,pddl,calibration]"]

[project.urls]
Homepage = "https://github.com/CLAIR-LAB-TECHNION/s3e"
Documentation = "https://s3e.readthedocs.io"
Repository = "https://github.com/CLAIR-LAB-TECHNION/s3e"
Issues = "https://github.com/CLAIR-LAB-TECHNION/s3e/issues"
Changelog = "https://github.com/CLAIR-LAB-TECHNION/s3e/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["s3e*"]

[tool.ruff.lint]
# Correctness-focused rules only; there is no formatter.
select = ["E4", "E7", "E9", "F", "W", "B"]
ignore = [
    "E402",  # optional backends import their dependency after require()
    "B905",  # zip(strict=...) would change behavior
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # bare attribute access inside pytest.raises
